<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<title>Lunar Descent II — Fuel Run</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",Courier,monospace;color:#dfe9ff;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  #pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px calc(18px + env(safe-area-inset-bottom));pointer-events:none;-webkit-touch-callout:none}
  #pad button{pointer-events:auto;width:84px;height:84px;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;border:1.5px solid #dfe9ff;background:rgba(0,0,0,.35);color:#dfe9ff;font:28px "Courier New",monospace;border-radius:50%;box-shadow:0 0 8px rgba(223,233,255,.35)}
  #pad button:active{background:#dfe9ff;color:#000}
  #pad .r{display:flex;gap:16px}
  #pad #bt{width:96px;height:96px;font-size:34px}
  #bp{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:44px;height:36px;border:1.5px solid #dfe9ff;background:rgba(0,0,0,.4);color:#dfe9ff;font:18px "Courier New",monospace;border-radius:4px;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  @media (hover:hover) and (pointer:fine){#pad{display:none}#bp{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="bp" oncontextmenu="return false">‖</button>
<div id="pad" oncontextmenu="return false">
  <div class="r"><button id="bl">◀</button><button id="br">▶</button></div>
  <button id="bt">▲</button>
</div>
<script>
(() => {
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();

// ---- constants ----
const G=0.0095, THRUST=0.038, ROT=0.045, FUEL_MAX=1200, BURN=1.4, ROT_BURN=0.12;
const WORLD_W=6400, GROUND_BASE=620;
const keys={l:false,r:false,t:false,any:false};


// ---- audio (Web Audio, no assets) ----
const SFX=(()=>{
  let ac=null,thr=null,thrG=null,thrF=null,refuelOsc=null,refuelG=null,lastBeep=0;
  function ctx(){ if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();} if(ac.state==='suspended')ac.resume(); return ac; }
  function noise(dur){const a=ctx(),b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
  function tone(f,dur,type='square',vol=0.15,slide=0){
    const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),a.currentTime+dur);
    g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
    o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur);
  }
  return {
    unlock(){try{ctx();}catch(e){}},
    thrust(on){
      if(!ac)return;
      if(on&&!thr){
        thr=ac.createBufferSource();thr.buffer=noise(1);thr.loop=true;
        thrF=ac.createBiquadFilter();thrF.type='lowpass';thrF.frequency.value=220;thrF.Q.value=0.8;
        const sub=ac.createOscillator(),sg=ac.createGain();sub.type='sawtooth';sub.frequency.value=38;sg.gain.value=0.12;const sf=ac.createBiquadFilter();sf.type='lowpass';sf.frequency.value=120;sub.connect(sf).connect(sg);thr._sub=sub;thr._sg=sg;
        thrG=ac.createGain();thrG.gain.setValueAtTime(0.001,ac.currentTime);thrG.gain.linearRampToValueAtTime(0.55,ac.currentTime+0.08);
        thr.connect(thrF).connect(thrG).connect(ac.destination);thr._sg.connect(thrG);thr._sub.start();thr.start();
      }else if(!on&&thr){
        const t=thr,g=thrG;g.gain.cancelScheduledValues(ac.currentTime);g.gain.setValueAtTime(g.gain.value,ac.currentTime);g.gain.linearRampToValueAtTime(0.001,ac.currentTime+0.12);
        t.stop(ac.currentTime+0.15);t._sub.stop(ac.currentTime+0.15);thr=null;thrG=null;
      }
    },
    rotate(){ if(!ac)return; const n=performance.now(); if(n-lastBeep<140)return; lastBeep=n;
      const b=ac.createBufferSource();b.buffer=noise(0.12);const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=0.7;
      const g=ac.createGain();g.gain.setValueAtTime(0.09,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.12);
      b.connect(f).connect(g).connect(ac.destination);b.start(); },
    crash(){
      if(!ac)return; this.thrust(false); this.refuel(false);
      const s=ac.createBufferSource();s.buffer=noise(1.2);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3000,ac.currentTime);f.frequency.exponentialRampToValueAtTime(80,ac.currentTime+1.1);
      const g=ac.createGain();g.gain.setValueAtTime(0.8,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+1.2);
      s.connect(f).connect(g).connect(ac.destination);s.start();
      tone(120,0.6,'sawtooth',0.3,-100);
    },
    land(perfect){ if(!ac)return; this.thrust(false); const seq=perfect?[523,659,784,1047]:[440,554,659]; seq.forEach((f,i)=>setTimeout(()=>tone(f,0.18,'square',0.12),i*110)); },
    touchdown(){ if(!ac)return; this.thrust(false); tone(80,0.15,'triangle',0.3,-40); },
    refuel(on){
      if(!ac)return;
      if(on&&!refuelOsc){
        refuelOsc=ac.createOscillator();refuelOsc.type='triangle';refuelOsc.frequency.setValueAtTime(220,ac.currentTime);
        refuelG=ac.createGain();refuelG.gain.value=0.08;
        const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=12;lg.gain.value=0.06;lfo.connect(lg).connect(refuelG.gain);lfo.start();
        refuelOsc.connect(refuelG).connect(ac.destination);refuelOsc.start();refuelOsc._lfo=lfo;
      }else if(!on&&refuelOsc){ refuelOsc.stop();refuelOsc._lfo.stop();refuelOsc=null;refuelG=null; }
    },
    refuelPitch(frac){ if(refuelOsc)refuelOsc.frequency.setTargetAtTime(220+frac*440,ac.currentTime,0.05); },
    full(){ if(!ac)return; this.refuel(false); [880,1175].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'square',0.12),i*140)); },
    liftoff(){ if(!ac)return; tone(200,0.3,'sawtooth',0.15,400); },
    lowFuel(){ if(!ac)return; tone(1400,0.08,'square',0.08); },
    empty(){ if(!ac)return; this.thrust(false); [600,450,300].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'square',0.12),i*180)); },
    gameOver(){ if(!ac)return; [392,349,311,262].forEach((f,i)=>setTimeout(()=>tone(f,0.4,'triangle',0.15),i*300)); },
    start(){ if(!ac)return; [523,784].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'square',0.1),i*90)); }
  };
})();

// ---- terrain ----
let terrain=[],pads=[],station=null;
function genTerrain(){
  terrain=[];pads=[];
  const step=24, n=Math.floor(WORLD_W/step)+1;
  // large-scale mountains + valleys from layered sines, plus fine random-walk detail
  const ph=[Math.random()*7,Math.random()*7,Math.random()*7];
  const A1=170+Math.random()*90, A2=70+Math.random()*50;
  let d=0;
  for(let i=0;i<n;i++){
    const x=i*step;
    const big=Math.sin(x/430+ph[0])*A1+Math.sin(x/190+ph[1])*A2+Math.sin(x/95+ph[2])*25;
    d+=(Math.random()-0.5)*40; d*=0.9;
    let y=GROUND_BASE-140-big+d;
    y=Math.max(GROUND_BASE-520,Math.min(GROUND_BASE+70,y));
    terrain.push({x,y});
  }
  // find valley floors (local minima of height => max y) for pad placement
  const valleys=[];
  for(let i=8;i<n-8;i++){
    let lo=true;for(let k=-7;k<=7;k++)if(terrain[i+k].y>terrain[i].y){lo=false;break;}
    if(lo)valleys.push(i);
  }
  // pads: 3 fuel depots + 4 scoring pads, non-overlapping
  const specs=[
    {kind:'fuel',w:4},{kind:'fuel',w:4},{kind:'fuel',w:4},{kind:'fuel',w:4},{kind:'fuel',w:4},
    {kind:'score',w:5,mult:1},{kind:'score',w:5,mult:1},{kind:'score',w:4,mult:2},{kind:'score',w:4,mult:2},
    {kind:'score',w:3,mult:3},{kind:'score',w:3,mult:3},{kind:'score',w:2,mult:5},{kind:'score',w:2,mult:5}
  ];
  const used=[];
  const vq=valleys.slice().sort(()=>Math.random()-0.5);
  for(const s of specs){
    let i=-1,tries=0;
    // fuel depots and the x3/x5 pads sit in valleys when one is free
    if(s.kind==='fuel'||s.mult>=3){
      while(vq.length){const v=vq.pop()-Math.floor(s.w/2);if(v>4&&v<n-6-s.w&&!used.some(u=>Math.abs(u-v)<s.w+5)){i=v;break;}}
    }
    while(i<0&&tries<80){const c=6+Math.floor(Math.random()*(n-12-s.w));tries++;if(!used.some(u=>Math.abs(u-c)<s.w+5))i=c;}
    if(i<0)continue;
    used.push(i);
    // flatten to the lowest point of the span so the pad sits in the terrain, not on stilts
    let py=-1e9;for(let k=0;k<=s.w;k++)py=Math.max(py,terrain[i+k].y);
    for(let k=0;k<=s.w;k++)terrain[i+k].y=py;
    pads.push({x1:terrain[i].x,x2:terrain[i+s.w].x,y:py,kind:s.kind,mult:s.mult||0});
  }
  // occasional orbital fuel station high above the peaks
  station=null;
  if(Math.random()<0.6){
    const w=110,x1=300+Math.random()*(WORLD_W-600);
    station={x1,x2:x1+w,y:GROUND_BASE-760,h:34,kind:'fuel',mult:0,orbital:true};
  }
}
function groundY(x){
  const step=24;
  const i=Math.max(0,Math.min(terrain.length-2,Math.floor(x/step)));
  const a=terrain[i],b=terrain[i+1];
  const t=(x-a.x)/(b.x-a.x);
  return a.y+(b.y-a.y)*t;
}
function padAt(x1,x2){return pads.find(p=>x1>=p.x1&&x2<=p.x2);}

// ---- lander ----
const L={x:0,y:0,vx:0,vy:0,a:0,fuel:FUEL_MAX,alive:true,landed:false,onPad:null};
let score=0,landers=3,state='title',msg='',msgT=0,debris=[],refuelT=0,time=0,zoom=1,scoredPads=new Set(),legs=false;
function spawn(){do{L.x=200+Math.random()*(WORLD_W-400);}while(station&&Math.abs(L.x-(station.x1+station.x2)/2)<400);L.y=GROUND_BASE-620;L.vx=0.6+Math.random()*0.6;L.vy=0;L.a=0;L.alive=true;L.landed=false;L.onPad=null;}
function newRound(){genTerrain();scoredPads=new Set();spawn();}
function reset(){score=0;landers=3;L.fuel=FUEL_MAX;time=0;newRound();state='play';msg='';SFX.start();}

function feet(){
  const s=Math.sin(L.a),c=Math.cos(L.a);
  return [[L.x-9*c-12*s, L.y-9*s+12*c],[L.x+9*c-12*s, L.y+9*s+12*c]];
}
function explode(){
  L.alive=false;debris=[];
  for(let i=0;i<14;i++){
    const ang=Math.random()*Math.PI*2,sp=1+Math.random()*2.5;
    debris.push({x:L.x,y:L.y,vx:Math.cos(ang)*sp+L.vx*0.5,vy:Math.sin(ang)*sp-1,a:Math.random()*6,va:(Math.random()-0.5)*0.4,len:4+Math.random()*8,life:120});
  }
  landers--;setMsg(landers>0?'CRASHED':'GAME OVER',150);SFX.crash();
  if(landers<=0){state='over';setTimeout(()=>SFX.gameOver(),900);}
}
function setMsg(m,t){msg=m;msgT=t;}

// ---- update ----
function update(){
  if(state==='paused')return;
  if(state==='play'){
    time++;
    if(L.alive&&!L.landed){
      if(keys.l&&L.fuel>0){L.a-=ROT;L.fuel-=ROT_BURN;SFX.rotate();}
      if(keys.r&&L.fuel>0){L.a+=ROT;L.fuel-=ROT_BURN;SFX.rotate();}
      const thrusting=keys.t&&L.fuel>0;SFX.thrust(thrusting);
      if(!L.fuel&&keys.t&&!L._emptyWarned){L._emptyWarned=true;SFX.empty();}
      if(thrusting){L.vx+=Math.sin(L.a)*THRUST;L.vy-=Math.cos(L.a)*THRUST;L.fuel-=BURN;}
      L.fuel=Math.max(0,L.fuel);
      L.vy+=G;L.x+=L.vx;L.y+=L.vy;
      if(L.x<20){L.x=20;L.vx=Math.abs(L.vx)*0.5;}
      if(L.x>WORLD_W-20){L.x=WORLD_W-20;L.vx=-Math.abs(L.vx)*0.5;}
      // collision
      const f=feet();
      const fx1=Math.min(f[0][0],f[1][0]),fx2=Math.max(f[0][0],f[1][0]),fy=Math.max(f[0][1],f[1][1]);
      let hit=f.some(p=>p[1]>=groundY(p[0]))||L.y>=groundY(L.x)-6;
      let pad=null;
      if(station&&!hit){
        const onTop=fx1>=station.x1&&fx2<=station.x2&&fy>=station.y-6&&fy<=station.y+16&&L.vy>=0;
        const inBox=L.x>station.x1-10&&L.x<station.x2+10&&L.y+12>station.y&&L.y-14<station.y+station.h;
        if(onTop){hit=true;pad=station;}else if(inBox){hit=true;}
      }
      if(hit){
        pad=pad||padAt(fx1,fx2);
        const soft=Math.abs(L.vx)<0.6&&L.vy<1.7&&Math.abs(L.a)<0.3;
        if(pad&&soft){
          L.landed=true;L.onPad=pad;L.vx=0;L.vy=0;L.a=0;L.y=pad.y-12;
          SFX.touchdown();
          if(pad.kind==='fuel'){refuelT=0;setMsg(pad.orbital?'DOCKED — REFUELING':'FUEL DEPOT — REFUELING',9999);setTimeout(()=>{if(L.landed&&L.fuel<FUEL_MAX)SFX.refuel(true);},250);}
          else{
            const key=pad.x1+':'+pad.mult;
            const quality=L.vy<0.6&&Math.abs(L.vx)<0.2?'PERFECT':'GOOD';
            let pts=(quality==='PERFECT'?100:50)*pad.mult;
            if(scoredPads.has(key))pts=Math.round(pts/4);
            scoredPads.add(key);score+=pts;
            setMsg(quality+' LANDING  +'+pts+'  (x'+pad.mult+')',150);setTimeout(()=>SFX.land(quality==='PERFECT'),200);
          }
        }else explode();
      }
    }else if(L.landed){
      if(L.onPad.kind==='fuel'){
        refuelT++;
        const wasFull=L.fuel>=FUEL_MAX;L.fuel=Math.min(FUEL_MAX,L.fuel+6);SFX.refuelPitch(L.fuel/FUEL_MAX);
        if(L.fuel>=FUEL_MAX){setMsg('TANK FULL — LIFT OFF',9999);if(!wasFull)SFX.full();}
        if(keys.t&&L.fuel>0){L.landed=false;L.onPad=null;L.vy=-0.6;msg='';L._emptyWarned=false;SFX.refuel(false);SFX.liftoff();}
      }else{
        if(msgT<=0||keys.t){newRound();}
      }
    }else{ // dead
      if(msgT<=0&&landers>0){spawn();L._emptyWarned=false;}
    }
    if(L.fuel<=0&&!L.landed&&L.alive&&L.vy>2.5&&msgT<=0)setMsg('OUT OF FUEL',60);
  }
  if(msgT>0)msgT--;
  for(const d of debris){d.x+=d.vx;d.y+=d.vy;d.vy+=G;d.a+=d.va;d.life--;}
  debris=debris.filter(d=>d.life>0);
  // zoom in near ground, like the original
  const alt=groundY(L.x)-L.y;
  const target=(L.alive&&alt<110)?(W<700?1.25:1.45):1;
  zoom+=(target-zoom)*0.06;
}

// ---- draw ----
function drawLander(x,y,a,thrust){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.beginPath();
  // capsule
  ctx.moveTo(-6,-14);ctx.lineTo(6,-14);ctx.lineTo(9,-6);ctx.lineTo(-9,-6);ctx.closePath();
  // body
  ctx.moveTo(-10,-6);ctx.lineTo(10,-6);ctx.lineTo(10,2);ctx.lineTo(-10,2);ctx.closePath();
  // legs
  ctx.moveTo(-8,2);ctx.lineTo(-12,12);ctx.moveTo(-15,12);ctx.lineTo(-9,12);
  ctx.moveTo(8,2);ctx.lineTo(12,12);ctx.moveTo(15,12);ctx.lineTo(9,12);
  // nozzle
  ctx.moveTo(-4,2);ctx.lineTo(-6,7);ctx.lineTo(6,7);ctx.lineTo(4,2);
  ctx.stroke();
  if(thrust){
    const f=8+Math.random()*10;
    ctx.beginPath();ctx.moveTo(-5,7);ctx.lineTo(0,7+f);ctx.lineTo(5,7);ctx.stroke();
  }
  ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#dfe9ff';ctx.fillStyle='#dfe9ff';ctx.lineWidth=1.4;ctx.lineJoin='round';
  ctx.shadowColor='rgba(180,205,255,.7)';ctx.shadowBlur=6;

  // starfield: screen space, full height, slow parallax against the camera
  ctx.save();ctx.shadowBlur=0;
  const px=(L.x*0.15),py=(L.y*0.05);
  for(let i=0;i<160;i++){
    const x=(((i*397+(i*i)%53)-px)%(W+40)+W+40)%(W+40)-20, y=(((i*211+(i*7)%31)-py)%(H+40)+H+40)%(H+40)-20;
    const b=i%7===0?1.8:1.1;ctx.globalAlpha=i%5===0?0.55:0.9;ctx.fillRect(x,y,b,b);
  }
  ctx.globalAlpha=1;ctx.restore();

  // camera
  const worldH=H*0.78;
  const mobile=W<700;
  const sx=Math.max(W/1400,H/1500)*zoom, sy=sx;
  let camX=L.x, camY=L.y+40;
  const viewW=W/sx, viewH=H/sy;
  camX=Math.max(viewW/2,Math.min(WORLD_W-viewW/2,camX));
  camY=Math.min(GROUND_BASE+120-viewH/2,camY);
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(sx,sy);ctx.translate(-camX,-camY);


  // terrain (solid black below the surface, then the outline)
  ctx.save();ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.beginPath();ctx.moveTo(terrain[0].x,terrain[0].y);
  for(const p of terrain)ctx.lineTo(p.x,p.y);
  ctx.lineTo(terrain[terrain.length-1].x,GROUND_BASE+4000);ctx.lineTo(terrain[0].x,GROUND_BASE+4000);ctx.closePath();ctx.fill();ctx.restore();
  ctx.beginPath();ctx.moveTo(terrain[0].x,terrain[0].y);
  for(const p of terrain)ctx.lineTo(p.x,p.y);
  ctx.stroke();ctx.fillStyle='#dfe9ff';
  // pads
  for(const p of pads){
    ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(p.x1,p.y+1);ctx.lineTo(p.x2,p.y+1);ctx.stroke();ctx.lineWidth=1.4;
    ctx.font='11px "Courier New",monospace';ctx.textAlign='center';
    const label=p.kind==='fuel'?'FUEL':'x'+p.mult;
    const cx=(p.x1+p.x2)/2;
    if(p.kind==='fuel'){
      // small pump icon
      ctx.beginPath();ctx.rect(cx-5,p.y-16,10,12);ctx.moveTo(cx+5,p.y-12);ctx.lineTo(cx+9,p.y-12);ctx.lineTo(cx+9,p.y-4);ctx.stroke();
      ctx.fillText(label,cx,p.y+16);
    }else ctx.fillText(label,cx,p.y+16);
  }
  // orbital station
  if(station){
    const st=station,cx=(st.x1+st.x2)/2;
    ctx.beginPath();
    ctx.moveTo(st.x1,st.y);ctx.lineTo(st.x2,st.y);
    ctx.moveTo(st.x1+6,st.y);ctx.lineTo(st.x1+6,st.y+st.h);ctx.lineTo(st.x2-6,st.y+st.h);ctx.lineTo(st.x2-6,st.y);
    for(let x=st.x1+6;x<st.x2-6;x+=16){ctx.moveTo(x,st.y);ctx.lineTo(x+16,st.y+st.h);}
    ctx.moveTo(st.x1-40,st.y+st.h/2);ctx.lineTo(st.x1+6,st.y+st.h/2);ctx.moveTo(st.x2-6,st.y+st.h/2);ctx.lineTo(st.x2+40,st.y+st.h/2);
    ctx.rect(st.x1-40,st.y+st.h/2-9,26,18);ctx.rect(st.x2+14,st.y+st.h/2-9,26,18);
    ctx.moveTo(cx,st.y+st.h);ctx.lineTo(cx,st.y+st.h+22);ctx.moveTo(cx-6,st.y+st.h+22);ctx.lineTo(cx+6,st.y+st.h+22);
    ctx.stroke();
    ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(st.x1,st.y+1);ctx.lineTo(st.x2,st.y+1);ctx.stroke();ctx.lineWidth=1.4;
    if(Math.floor(time/30)%2===0){ctx.fillRect(st.x1-2,st.y-4,3,3);ctx.fillRect(st.x2-1,st.y-4,3,3);}
    ctx.font='11px "Courier New",monospace';ctx.textAlign='center';ctx.fillText('STATION · FUEL',cx,st.y-10);
  }
  // lander
  if(L.alive)drawLander(L.x,L.y,L.a,keys.t&&L.fuel>0&&!L.landed&&state==='play');
  for(const d of debris){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.a);ctx.beginPath();ctx.moveTo(-d.len/2,0);ctx.lineTo(d.len/2,0);ctx.stroke();ctx.restore();}
  ctx.restore();

  // HUD
  ctx.shadowBlur=4;const hf=W<700?12:14;ctx.font=hf+'px "Courier New",monospace';ctx.textAlign='left';
  const alt=Math.max(0,Math.round(groundY(L.x)-L.y-12));
  const lines=[
    ['SCORE',String(score).padStart(5,'0')],
    ['TIME',Math.floor(time/60/60)+':'+String(Math.floor(time/60)%60).padStart(2,'0')],
    ['FUEL',String(Math.round(L.fuel)).padStart(4,'0')],
    ['LANDERS','▲'.repeat(Math.max(0,landers))]
  ];
  const hx=W<700?14:16,hy=W<700?22:26,hs=W<700?16:18;
  lines.forEach((l,i)=>{ctx.fillText(l[0],hx,hy+i*hs);ctx.fillText(l[1],hx+(W<700?70:80),hy+i*hs);});
  ctx.textAlign='right';
  const rt=[
    ['ALTITUDE',alt],
    ['HORIZ SPEED',Math.abs(L.vx*40).toFixed(0)+(L.vx<0?' ←':L.vx>0?' →':'')],
    ['VERT SPEED',Math.abs(L.vy*40).toFixed(0)+(L.vy<0?' ↑':L.vy>0?' ↓':'')]
  ];
  rt.forEach((l,i)=>{ctx.fillText(l[0],W-(W<700?70:96),hy+i*hs);ctx.fillText(String(l[1]),W-hx,hy+i*hs);});
  // fuel gauge
  const gy=hy+4*hs-6,gw=W<700?100:120;ctx.strokeRect(hx,gy,gw,8);ctx.fillRect(hx,gy,gw*(L.fuel/FUEL_MAX),8);
  if(L.fuel<FUEL_MAX*0.2&&Math.floor(time/20)%2===0){ctx.textAlign='left';ctx.fillText('LOW FUEL',hx+gw+10,gy+8);}
  if(state==='play'&&L.alive&&!L.landed&&L.fuel>0&&L.fuel<FUEL_MAX*0.2&&time%40===0)SFX.lowFuel();

  // messages
  ctx.textAlign='center';
  if(msg&&msgT>0){ctx.font=(W<700?15:18)+'px "Courier New",monospace';ctx.fillText(msg,W/2,H*0.32);}
  if(state==='title'){
    const m=W<700;
    ctx.font=(m?26:34)+'px "Courier New",monospace';ctx.fillText('LUNAR DESCENT II',W/2,H*0.34);
    ctx.font=(m?14:16)+'px "Courier New",monospace';ctx.fillText('FUEL RUN',W/2,H*0.34+26);
    ctx.font=(m?11:13)+'px "Courier New",monospace';
    const tips=m?[
     'Land softly on a marked pad to score.',
     'FUEL pads refill your tank.',
     'Lift off, or dock at a station.',
     '',
     'Vert speed < 65, horiz < 24,',
     'roughly upright.',
     '',
     '◀ ▶ rotate    ▲ thrust',
     '',
     'TAP TO START  (SOUND ON)'
    ]:[
     'Land softly on a marked pad to score.',
     'FUEL pads and orbital stations refill your tank — lift off and keep going.',
     'Vertical speed under 65, horizontal under 24, roughly upright.',
     '',
     '← → rotate    ▲ / space thrust    P pause',
     '',
     'PRESS ANY KEY TO START  (SOUND ON)'
    ];
    tips.forEach((t,i)=>ctx.fillText(t,W/2,H*0.34+58+i*(m?17:20)));
  }
  if(state==='paused'){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#dfe9ff';
    ctx.font=(W<700?24:28)+'px "Courier New",monospace';ctx.fillText('PAUSED',W/2,H*0.42);
    ctx.font=(W<700?12:14)+'px "Courier New",monospace';ctx.fillText(W<700?'TAP ‖ TO RESUME':'PRESS P TO RESUME',W/2,H*0.42+30);
  }
  if(state==='over'&&msgT<=0){
    ctx.font=(W<700?24:28)+'px "Courier New",monospace';ctx.fillText('GAME OVER',W/2,H*0.40);
    ctx.font=(W<700?13:15)+'px "Courier New",monospace';ctx.fillText('FINAL SCORE '+score,W/2,H*0.40+30);
    ctx.fillText(W<700?'TAP TO PLAY AGAIN':'PRESS ANY KEY OR TAP TO PLAY AGAIN',W/2,H*0.40+56);
  }
}

// ---- input ----
function startIfIdle(){ SFX.unlock(); if(state==='title'||(state==='over'&&msgT<=0)){reset();return true;} return false; }
function togglePause(){
  if(state==='play'){state='paused';SFX.thrust(false);SFX.refuel(false);keys.l=keys.r=keys.t=false;}
  else if(state==='paused'){state='play';if(L.landed&&L.onPad&&L.onPad.kind==='fuel'&&L.fuel<FUEL_MAX)SFX.refuel(true);}
}
addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){togglePause();e.preventDefault();return;}
  if(state==='paused')return;
  if(startIfIdle()){e.preventDefault();return;}
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=true;
  if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')keys.t=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=false;
  if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')keys.t=false;
});
function bind(id,k){
  const b=document.getElementById(id);
  const on=e=>{e.preventDefault();if(!startIfIdle())keys[k]=true;};
  const off=e=>{e.preventDefault();keys[k]=false;};
  b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off);b.addEventListener('touchcancel',off);
  b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);
}
bind('bl','l');bind('br','r');bind('bt','t');
const bp=document.getElementById('bp');
bp.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();if(state==='play'||state==='paused')togglePause();},{passive:false});
bp.addEventListener('click',e=>{e.stopPropagation();if(state==='play'||state==='paused')togglePause();});
cv.addEventListener('touchstart',e=>{if(state!=='paused')startIfIdle();},{passive:true});
cv.addEventListener('mousedown',e=>{startIfIdle();});

// ---- loop ----
genTerrain();spawn();
let last=0,acc=0;
function loop(t){
  acc+=Math.min(50,t-last);last=t;
  while(acc>=1000/60){update();acc-=1000/60;}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
